name: CLA Assistant

# MIGRATED: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # PS-224: map the ONE secret the callee declares, instead of
    # `secrets: inherit`. This job is started by `issue_comment` and
    # `pull_request_target`, which an outsider can trigger and which the
    # fork-PR approval gate does NOT cover — so `inherit` forwarded every
    # secret this repo holds into an outsider-triggerable job.
    #
    # The name is read from the callee, not assumed:
    # scitex-ai/.github `cla.yml@main` declares exactly one secret,
    # `GH_PERSONAL_ACCESS_TOKEN` (required: true). GITHUB_TOKEN is
    # provided automatically and is not mapped here.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}